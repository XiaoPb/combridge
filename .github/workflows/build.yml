# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and Release Tauri App


# 触发条件：推送标签时触发发布，推送 main 时构建但不发布
on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'           # 推送 v1.0.0 这样的标签时触发
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:    # 支持手动触发

# 环境变量
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 先测试 C 库的编译
  test-c-library:
    name: Test C Library Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib-ext: .a
            c-compiler: gcc
            
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib-ext: .lib
            c-compiler: msvc
            
          - os: macos-latest
            target: aarch64-apple-darwin
            lib-ext: .a
            c-compiler: clang

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ============ Linux 环境准备 ============
      # Ubuntu 24.04 使用 webkit2gtk-4.1，旧版本使用 4.0
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if apt-cache showpkg libwebkit2gtk-4.1-dev > /dev/null 2>&1; then
            WEBKIT_PKG="libwebkit2gtk-4.1-dev"
          else
            WEBKIT_PKG="libwebkit2gtk-4.0-dev"
          fi
          sudo apt-get install -y \
            $WEBKIT_PKG \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake \
            pkg-config

      # ============ Windows 环境准备 ============
      - name: Setup Windows build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============ macOS 环境准备 ============
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config

      # ============ 编译 C 库 ============
      - name: Build C library (CMake)
        working-directory: libs/gh_protocol
        run: |
          mkdir -p build
          cd build
          cmake ..
          cmake --build . --config Release
          
      - name: Verify C library build
        working-directory: libs/gh_protocol/build
        shell: bash
        run: |
          ls -la
          # 检查生成的库文件
          if [ "${{ runner.os }}" = "Windows" ]; then
            ls -la Release/ 2>/dev/null || echo "No Release directory"
          else
            find . -name "*.a" -o -name "*.so" -o -name "*.dylib" 2>/dev/null || echo "No library files found"
          fi

      # ============ 上传 C 库产物（供后续步骤使用） ============
      - name: Upload C library artifact
        uses: actions/upload-artifact@v7
        with:
          name: c-library-${{ matrix.os }}-${{ matrix.target }}
          path: |
            libs/gh_protocol/build/*.a
            libs/gh_protocol/build/*.lib
            libs/gh_protocol/build/*.so
            libs/gh_protocol/build/*.dylib
            libs/gh_protocol/build/Release/*.lib
          retention-days: 1

  # 主构建任务：编译 Tauri 应用
  build-tauri:
    name: Build Tauri App on ${{ matrix.os }}
    needs: test-c-library    # 等待 C 库测试完成
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle-suffix: AppImage
            
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-suffix: .exe
            
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle-suffix: .app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ============ 下载 C 库产物 ============
      - name: Download C library artifact
        uses: actions/download-artifact@v8
        with:
          name: c-library-${{ matrix.os }}-${{ matrix.target }}
          path: libs/gh_protocol/build/

      # ============ 设置 Rust ============
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # ============ 设置 Node.js ============
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      # ============ 安装前端依赖 ============
      - name: Install frontend dependencies
        run: npm ci

      # ============ 构建前端 ============
      - name: Build frontend
        run: npm run build

      # ============ Linux 特定依赖 ============
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ubuntu 24.04 使用 webkit2gtk-4.1，旧版本使用 4.0
          if apt-cache showpkg libwebkit2gtk-4.1-dev > /dev/null 2>&1; then
            WEBKIT_PKG="libwebkit2gtk-4.1-dev"
          else
            WEBKIT_PKG="libwebkit2gtk-4.0-dev"
          fi
          sudo apt-get install -y \
            $WEBKIT_PKG \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev

      # ============ 安装 Tauri CLI ============
      - name: Install Tauri CLI
        run: cargo install tauri-cli

      # ============ 构建 Tauri 应用 ============
      - name: Build Tauri app
        working-directory: src-tauri
        env:
          # 告诉 Rust 链接器在哪里找 C 库
          # Windows: build/Release, Linux/macOS: build/
          RUSTFLAGS: ${{ runner.os == 'Windows' && format('-L native={0}/libs/gh_protocol/build/Release', github.workspace) || format('-L native={0}/libs/gh_protocol/build', github.workspace) }}
        run: |
          cargo tauri build --target ${{ matrix.target }}
          
      # ============ 列出构建产物 ============
      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts for ${{ matrix.os }}:"
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/ 2>/dev/null || echo "Bundle directory not found"

      # ============ 上传构建产物 ============
      - name: Upload Tauri bundle
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundle-${{ matrix.os }}-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7

  # 发布任务：仅在推送标签时执行
  release:
    name: Create GitHub Release
    needs: build-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Download all Tauri bundles
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-bundle-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Artifacts ready for release:"
          ls -la artifacts/
          
      - name: Create GitHub Release
        run: |
          echo "Creating release for ${{ github.ref_name }}"
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "自动化构建产物" \
            --draft false \
            artifacts/**
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
