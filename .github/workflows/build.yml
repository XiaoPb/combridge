# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and Release Tauri App


# 触发条件：推送标签时触发发布，推送 main 时构建但不发布
on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'           # 推送 v1.0.0 这样的标签时触发
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:    # 支持手动触发

# 环境变量
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 主构建任务：编译 Tauri 应用
  build-tauri:
    name: Build Tauri App on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle-suffix: AppImage

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-suffix: .exe

          - os: macos-latest
            target: aarch64-apple-darwin
            bundle-suffix: .app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ============ 设置 Rust ============
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # ============ 设置 Node.js ============
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      # ============ 安装前端依赖 ============
      - name: Install frontend dependencies
        run: npm ci

      # ============ 构建前端 ============
      - name: Build frontend
        run: npm run build

      # ============ Linux 特定依赖 ============
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 使用 webkit2gtk-4.1，旧版本使用 4.0
          if apt-cache showpkg libwebkit2gtk-4.1-dev > /dev/null 2>&1; then
            WEBKIT_PKG="libwebkit2gtk-4.1-dev"
          else
            WEBKIT_PKG="libwebkit2gtk-4.0-dev"
          fi
          for i in {1..3}; do
            sudo apt-get update || true
            sudo apt-get install -y --fix-missing \
              $WEBKIT_PKG \
              build-essential \
              curl \
              wget \
              file \
              libssl-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libudev-dev
            if [ $i -lt 3 ]; then sleep 10; fi
          done

      # ============ 安装 Tauri CLI ============
      - name: Install Tauri CLI
        run: cargo install tauri-cli

      # ============ 构建 Tauri 应用 ============
      - name: Build Tauri app
        working-directory: src-tauri
        run: |
          cargo tauri build --target ${{ matrix.target }}

      # ============ 列出构建产物 ============
      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts for ${{ matrix.os }}:"
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/ 2>/dev/null || echo "Bundle directory not found"

      # ============ 上传构建产物 ============
      - name: Upload Tauri bundle
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundle-${{ matrix.os }}-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7

  # 发布任务：仅在推送标签时执行
  release:
    name: Create GitHub Release
    needs: build-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Download all Tauri bundles
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-bundle-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Artifacts ready for release:"
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.app
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
