# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and Release Tauri App


# 触发条件：推送标签时触发发布，推送 main 时构建但不发布
on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # 仅语义化版本标签（如 v1.0.0）触发发布
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:    # 支持手动触发

# 环境变量
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 主构建任务：编译 Tauri 应用
  build-tauri:
    name: Build Tauri App on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle-suffix: AppImage

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle-suffix: .exe

          - os: macos-latest
            target: aarch64-apple-darwin
            bundle-suffix: .app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ============ 设置 Rust ============
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # ============ 设置 Node.js ============
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      # ============ 安装前端依赖 ============
      - name: Install frontend dependencies
        run: npm ci

      # ============ 构建前端 ============
      - name: Build frontend
        run: npm run build

      # ============ Linux 特定依赖 ============
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 使用 webkit2gtk-4.1，旧版本使用 4.0
          if apt-cache showpkg libwebkit2gtk-4.1-dev > /dev/null 2>&1; then
            WEBKIT_PKG="libwebkit2gtk-4.1-dev"
          else
            WEBKIT_PKG="libwebkit2gtk-4.0-dev"
          fi
          for i in {1..3}; do
            sudo apt-get update || true
            sudo apt-get install -y --fix-missing \
              $WEBKIT_PKG \
              build-essential \
              curl \
              wget \
              file \
              libssl-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              libudev-dev
            if [ $i -lt 3 ]; then sleep 10; fi
          done

      # ============ 安装 Tauri CLI ============
      - name: Install Tauri CLI
        run: cargo install tauri-cli

      # ============ 构建 Tauri 应用 ============
      - name: Build Tauri app
        working-directory: src-tauri
        run: |
          cargo tauri build --target ${{ matrix.target }}

      # ============ 列出构建产物 ============
      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts for ${{ matrix.os }}:"
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/ 2>/dev/null || echo "Bundle directory not found"

      # ============ 上传构建产物 ============
      - name: Upload Tauri bundle
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundle-${{ matrix.os }}-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7

  # 发布任务：仅在推送标签时执行
  release:
    name: Create GitHub Release
    needs: build-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      pull-requests: read

    steps:
      # ============ 拉取完整提交历史与标签（生成变更日志所需） ============
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract tag version
        id: tag_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ============ 校验标签与项目版本一致 ============
      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          TAURI_VERSION=$(sed -nE 's/^[[:space:]]*"version": "([^"]+)".*/\1/p' src-tauri/tauri.conf.json | head -n1)
          NPM_VERSION=$(sed -nE 's/^[[:space:]]*"version": "([^"]+)".*/\1/p' package.json | head -n1)
          CARGO_VERSION=$(sed -nE 's/^version = "([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -n1)

          if [ "${TAURI_VERSION}" != "${VERSION}" ] || [ "${NPM_VERSION}" != "${VERSION}" ] || [ "${CARGO_VERSION}" != "${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与项目版本不一致（tauri.conf.json=${TAURI_VERSION}, package.json=${NPM_VERSION}, Cargo.toml=${CARGO_VERSION}）"
            exit 1
          fi
          echo "版本 ${VERSION} 与 tag 一致"

      - name: Download all Tauri bundles
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-bundle-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Artifacts ready for release:"
          ls -la artifacts/

      # ============ 生成详细发布说明 ============
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.tag_version.outputs.VERSION }}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            COMPARE="[${PREV_TAG}...${TAG}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG})"
          else
            RANGE="${TAG}"
            COMPARE="[${TAG}](https://github.com/${GITHUB_REPOSITORY}/commits/${TAG})"
          fi

          mkdir -p .release
          for key in feat fix perf refactor build ci docs test style other; do
            : > ".release/${key}.md"
          done

          # 按 conventional commit 前缀分类提交
          while IFS=$'\t' read -r short subject; do
            [ -z "${subject}" ] && continue
            type=$(printf '%s' "${subject}" | sed -nE 's/^([a-z]+)(\([^)]*\))?!?:.*/\1/p')
            case "${type}" in
              feat|fix|perf|refactor|build|ci|docs|test|style) ;;
              *) type=other ;;
            esac
            printf -- '- %s (`%s`)\n' "${subject}" "${short}" >> ".release/${type}.md"
          done < <(git log --no-merges --pretty=format:'%h%x09%s%n' "${RANGE}")

          CONTRIBUTORS="$(git log --no-merges --pretty='%an' "${RANGE}" | sort -u | tr '\n' ',' | sed 's/,/, /g; s/, $//')"
          COMMIT_COUNT="$(git rev-list --count --no-merges "${RANGE}")"

          # 安装包清单：文件名、平台、大小、SHA-256
          mkdir -p .release
          : > .release/assets.md
          while IFS= read -r file; do
            name="$(basename "${file}")"
            lower="${name,,}"
            case "${lower}" in
              *.exe|*.msi) platform="Windows" ;;
              *.dmg) platform="macOS" ;;
              *.appimage|*.deb|*.rpm) platform="Linux" ;;
              *) continue ;;
            esac
            size="$(du -h "${file}" | cut -f1)"
            sha="$(sha256sum "${file}" | cut -d' ' -f1)"
            printf -- '| `%s` | %s | %s | `%s` |\n' "${name}" "${platform}" "${size}" "${sha}" >> .release/assets.md
          done < <(find artifacts -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.dmg' -o -iname '*.appimage' -o -iname '*.deb' -o -iname '*.rpm' \) | sort)

          {
            echo "## 版本信息"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${TAG}\` |"
            echo "| 提交 | \`${GITHUB_SHA::7}\` |"
            echo "| 提交数量 | ${COMMIT_COUNT} |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| 构建目标 | Windows x64 / macOS arm64 / Linux x64 |"
            echo "| 运行环境 | Windows 10+ / macOS 11+ / Linux (webkit2gtk) |"
            echo ""
            echo "## 安装包"
            echo ""
            if [ -s .release/assets.md ]; then
              echo "| 文件 | 平台 | 大小 | SHA-256 |"
              echo "| --- | --- | --- | --- |"
              cat .release/assets.md
            else
              echo "未找到构建产物。"
            fi
            echo ""
            echo "## 变更内容"
            echo ""
            for key in feat fix perf refactor build ci docs test style other; do
              if [ -s ".release/${key}.md" ]; then
                case "${key}" in
                  feat) title="新功能" ;;
                  fix) title="问题修复" ;;
                  perf) title="性能优化" ;;
                  refactor) title="重构" ;;
                  build) title="构建与依赖" ;;
                  ci) title="CI/CD" ;;
                  docs) title="文档" ;;
                  test) title="测试" ;;
                  style) title="代码风格" ;;
                  *) title="其他改动" ;;
                esac
                echo "### ${title}"
                echo ""
                cat ".release/${key}.md"
                echo ""
              fi
            done
            echo "## 下载说明"
            echo ""
            echo "- Windows：\`.exe\` 安装包或 \`.msi\` 安装包"
            echo "- macOS：\`.dmg\` 磁盘镜像"
            echo "- Linux：\`.AppImage\` 或 \`.deb\` 安装包"
            echo ""
            echo "## 贡献者"
            echo ""
            echo "${CONTRIBUTORS}"
            echo ""
            echo "## 对比"
            echo ""
            echo "${COMPARE}"
          } > release-notes.md

          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.app
          body_path: release-notes.md
          draft: false
          prerelease: false
          name: ComBridge ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
