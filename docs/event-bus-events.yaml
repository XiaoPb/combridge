      - topic: "dashboard/parser/save/request"
      - topic: "dashboard/parser/{script_id}/delete/request"
      - topic: "dashboard/parser/execute/request"
      - topic: "dashboard/json/list/request"
      - topic: "dashboard/json/{config_id}/get/request"
      - topic: "dashboard/json/save/request"
      - topic: "dashboard/json/{config_id}/delete/request"

  SystemManager:
