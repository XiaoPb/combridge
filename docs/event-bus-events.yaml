event_bus:
  description: "ComBridge 事件总线配置文档 - 精简版"
  version: "3.0.0"
  last_updated: "2026-04-15"
  
  design_principles:
    data_flow: "Event Bus 广播（一对多）"
    control_flow: "Tauri Command（点对点）"
    state_query: "Tauri Command（直接方法调用）"
    
  removed_features:
    - "请求-响应模式 → 改用 Tauri Command"
    - "通配符订阅 → 前端自行过滤"
    - "retain 消息 → 前端缓存状态"
    - "QoS 级别 → 本地事件总线不需要"

tauri_events:
  event_bus_channel:
    name: "event-bus"
    description: "统一事件总线通道，所有后端事件通过此通道转发到前端"
    direction: "backend_to_frontend"
    payload_schema:
      topic:
        type: "string"
        description: "事件主题"
      payload:
        type: "string"
        description: "事件载荷（JSON字符串或Base64编码的MsgPack数据）"
      timestamp:
        type: "number"
        description: "时间戳（毫秒）"
      encoding:
        type: "string"
        enum: ["json", "msgpack+base64"]
        description: "编码格式：json 表示 JSON 字符串，msgpack+base64 表示 Base64 编码的 MsgPack 数据"

data_flow_events:
  description: "数据流事件 - 通过 Event Bus 广播（一对多）"
  
  serial_events:
    serial_data:
      topic: "serial:data"
      description: "串口接收原始数据事件"
      publisher: "SerialManager"
      payload:
        device_id:
          type: "string"
          description: "设备ID（端口名称）"
          example: "COM1"
        data:
          type: "array<number>"
          description: "接收数据（字节数组）"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    serial_connected:
      topic: "serial:connected"
      description: "串口连接成功事件"
      publisher: "SerialManager"
      payload:
        port_name:
          type: "string"
          description: "端口名称"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    serial_disconnected:
      topic: "serial:disconnected"
      description: "串口断开连接事件"
      publisher: "SerialManager"
      payload:
        port_name:
          type: "string"
          description: "端口名称"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    serial_error:
      topic: "serial:error"
      description: "串口错误事件"
      publisher: "SerialManager"
      payload:
        port_name:
          type: "string"
        error_code:
          type: "string"
        error_message:
          type: "string"
        timestamp:
          type: "number"

  ble_events:
    ble_data:
      topic: "ble:data"
      description: "BLE特征值数据事件"
      publisher: "BleManager"
      payload:
        device_id:
          type: "string"
          description: "设备ID"
        address:
          type: "string"
          description: "设备MAC地址"
        characteristic_uuid:
          type: "string"
          description: "特征UUID"
        data:
          type: "array<number>"
          description: "接收数据（字节数组）"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    ble_connected:
      topic: "ble:connected"
      description: "BLE设备连接成功事件"
      publisher: "BleManager"
      payload:
        address:
          type: "string"
          description: "设备MAC地址"
        name:
          type: "string"
          optional: true
          description: "设备名称"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    ble_disconnected:
      topic: "ble:disconnected"
      description: "BLE设备断开连接事件"
      publisher: "BleManager"
      payload:
        address:
          type: "string"
          description: "设备MAC地址"
        name:
          type: "string"
          optional: true
          description: "设备名称"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    ble_discovered:
      topic: "ble:discovered"
      description: "BLE设备发现事件（扫描期间）"
      publisher: "BleManager"
      payload:
        address:
          type: "string"
          description: "设备MAC地址"
        name:
          type: "string"
          description: "设备名称"
        rssi:
          type: "number"
          description: "信号强度"
        advertised_data:
          type: "object"
          description: "广播数据"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    ble_scan_status:
      topic: "ble:scan:status"
      description: "BLE扫描状态事件"
      publisher: "BleManager"
      payload:
        scanning:
          type: "boolean"
          description: "是否正在扫描"
        devices_found:
          type: "number"
          description: "已发现设备数量"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    ble_error:
      topic: "ble:error"
      description: "BLE错误事件"
      publisher: "BleManager"
      payload:
        address:
          type: "string"
          optional: true
        operation:
          type: "string"
        error_code:
          type: "string"
        error_message:
          type: "string"
        timestamp:
          type: "number"

  gh3036_events:
    gh3036_frame:
      topic: "gh3036:frame"
      description: "GH3036帧数据事件"
      publisher: "Gh3036Manager"
      payload:
        function_id:
          type: "number"
          description: "功能ID"
        function_name:
          type: "string"
          description: "功能名称"
        frame_id:
          type: "number"
          description: "帧ID"
        channel_count:
          type: "number"
          description: "通道数量"
        channels:
          type: "array<number>"
          description: "通道数据"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    gh3036_event:
      topic: "gh3036:event"
      description: "GH3036通用事件"
      publisher: "Gh3036Manager"
      payload:
        event_type:
          type: "string"
          enum: ["initialized", "started", "stopped", "error"]
          description: "事件类型"
        data:
          type: "object"
          description: "事件数据"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    gh3036_channel_changed:
      topic: "gh3036:channel:changed"
      description: "TX/RX通道变更事件"
      publisher: "Gh3036Manager"
      payload:
        channel_type:
          type: "string"
          enum: ["tx", "rx"]
          description: "通道类型"
        device_id:
          type: "string"
          description: "设备ID"
        channel_config:
          type: "object"
          description: "通道配置"
          properties:
            channel_type: { type: "string" }
            device_id: { type: "string" }
            characteristic_uuid: { type: "string", optional: true }
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

  protocol_events:
    protocol_parsed:
      topic: "protocol:parsed"
      description: "协议解析结果事件"
      publisher: "PluginManager"
      payload:
        plugin_id:
          type: "string"
          description: "插件ID"
        device_id:
          type: "string"
          description: "设备ID"
        original_data:
          type: "array<number>"
          description: "原始数据（字节数组）"
        parsed_data:
          type: "object"
          description: "解析后数据（JSON对象）"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    protocol_error:
      topic: "protocol:error"
      description: "协议解析错误事件"
      publisher: "PluginManager"
      payload:
        plugin_id:
          type: "string"
          description: "插件ID"
        device_id:
          type: "string"
          optional: true
          description: "设备ID"
        error_code:
          type: "string"
          description: "错误代码"
        error_message:
          type: "string"
          description: "错误消息"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

  waveform_events:
    waveform_data:
      topic: "waveform:data"
      description: "波形数据更新事件"
      publisher: "WaveformManager"
      payload:
        buffer_id:
          type: "string"
          description: "缓冲区ID"
        columns:
          type: "array<string>"
          description: "列名数组"
        rows:
          type: "array<array<number>>"
          description: "数据行数组"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    waveform_status:
      topic: "waveform:status"
      description: "缓冲区状态变化事件"
      publisher: "WaveformManager"
      payload:
        buffer_id:
          type: "string"
          description: "缓冲区ID"
        row_count:
          type: "number"
          description: "行数"
        column_count:
          type: "number"
          description: "列数"
        capacity:
          type: "number"
          description: "缓冲区容量"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

  dashboard_events:
    dashboard_parser_updated:
      topic: "dashboard:parser:updated"
      description: "解析脚本更新事件"
      publisher: "DashboardManager"
      payload:
        script_id:
          type: "string"
          description: "脚本ID"
        content:
          type: "string"
          description: "脚本内容"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    dashboard_json_updated:
      topic: "dashboard:json:updated"
      description: "JSON配置更新事件"
      publisher: "DashboardManager"
      payload:
        config_id:
          type: "string"
          description: "配置ID"
        content:
          type: "object"
          description: "配置内容"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

  system_events:
    system_started:
      topic: "system:started"
      description: "应用启动完成事件"
      publisher: "SystemManager"
      payload:
        version:
          type: "string"
          description: "应用版本"
        startup_time_ms:
          type: "number"
          description: "启动耗时（毫秒）"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    system_shutdown:
      topic: "system:shutdown"
      description: "应用关闭事件"
      publisher: "SystemManager"
      payload:
        reason:
          type: "string"
          enum: ["user_request", "error", "update", "system"]
          description: "关闭原因"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    system_config_changed:
      topic: "system:config:changed"
      description: "配置变更事件"
      publisher: "SystemManager"
      payload:
        config_key:
          type: "string"
          description: "配置键"
        old_value:
          type: "object"
          optional: true
          description: "旧值"
        new_value:
          type: "object"
          optional: true
          description: "新值"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

    system_error:
      topic: "system:error"
      description: "系统错误事件"
      publisher: "SystemManager"
      payload:
        error_code:
          type: "string"
          description: "错误代码"
        error_message:
          type: "string"
          description: "错误消息"
        context:
          type: "object"
          optional: true
          description: "错误上下文"
        timestamp:
          type: "number"
          description: "时间戳（毫秒）"

control_flow_commands:
  description: "控制流 - 通过 Tauri Command 实现（点对点）"
  
  serial_commands:
    - command: "open_port"
      description: "打开串口"
      params:
        port_name: { type: "string" }
        baud_rate: { type: "number", default: 115200 }
        data_bits: { type: "number", default: 8 }
        parity: { type: "string", default: "none" }
        stop_bits: { type: "number", default: 1 }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "close_port"
      description: "关闭串口"
      params:
        port_name: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "write_data"
      description: "写入数据到串口"
      params:
        port_name: { type: "string" }
        data: { type: "array<number>" }
      returns:
        success: { type: "boolean" }
        bytes_written: { type: "number" }
        error: { type: "string", optional: true }

    - command: "config_port"
      description: "配置串口参数"
      params:
        port_name: { type: "string" }
        baud_rate: { type: "number", optional: true }
        data_bits: { type: "number", optional: true }
        parity: { type: "string", optional: true }
        stop_bits: { type: "number", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "device_list"
      description: "获取串口设备列表及连接状态"
      params: {}
      returns:
        devices:
          type: "array"
          items:
            port_name: { type: "string", description: "端口名称，如 COM1" }
            description: { type: "string", description: "设备描述" }
            manufacturer: { type: "string", description: "制造商" }
            serial_number: { type: "string", description: "序列号" }
            product_id: { type: "string", description: "产品ID" }
            vendor_id: { type: "string", description: "供应商ID" }
            available: { type: "boolean", description: "是否可用" }
            connected: { type: "boolean", description: "是否已连接" }
            config:
              type: "object"
              description: "当前配置（仅已连接设备）"
              properties:
                baud_rate: { type: "number" }
                data_bits: { type: "number" }
                parity: { type: "string" }
                stop_bits: { type: "number" }

  ble_commands:
    - command: "start_scan"
      description: "开始BLE扫描"
      params:
        duration_ms: { type: "number", default: 5000 }
        service_uuids: { type: "array<string>", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "stop_scan"
      description: "停止BLE扫描"
      params: {}
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "connect_device"
      description: "连接BLE设备"
      params:
        address: { type: "string" }
        timeout_ms: { type: "number", default: 10000 }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "disconnect_device"
      description: "断开BLE设备"
      params:
        address: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "read_characteristic"
      description: "读取BLE特征值"
      params:
        address: { type: "string" }
        service_uuid: { type: "string" }
        characteristic_uuid: { type: "string" }
      returns:
        success: { type: "boolean" }
        data: { type: "array<number>", optional: true }
        error: { type: "string", optional: true }

    - command: "write_characteristic"
      description: "写入BLE特征值"
      params:
        address: { type: "string" }
        service_uuid: { type: "string" }
        characteristic_uuid: { type: "string" }
        data: { type: "array<number>" }
        write_type: { type: "string", default: "with_response" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "subscribe_characteristic"
      description: "订阅BLE特征值通知"
      params:
        address: { type: "string" }
        service_uuid: { type: "string" }
        characteristic_uuid: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "unsubscribe_characteristic"
      description: "取消订阅BLE特征值通知"
      params:
        address: { type: "string" }
        service_uuid: { type: "string" }
        characteristic_uuid: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "device_list"
      description: "获取BLE设备列表及连接状态"
      params: {}
      returns:
        devices:
          type: "array"
          items:
            address: { type: "string", description: "设备MAC地址" }
            name: { type: "string", description: "设备名称" }
            rssi: { type: "number", description: "信号强度" }
            connected: { type: "boolean", description: "是否已连接" }
            connectable: { type: "boolean", description: "是否可连接" }
            mtu: { type: "number", description: "MTU大小（仅已连接设备）" }
            services:
              type: "array"
              description: "服务列表（仅已连接设备）"
              items:
                uuid: { type: "string" }
                primary: { type: "boolean" }
                characteristics:
                  type: "array"
                  items:
                    uuid: { type: "string" }
                    properties: { type: "array<string>" }
            advertised_data:
              type: "object"
              description: "广播数据"

  gh3036_commands:
    - command: "config_tx_channel"
      description: "配置TX通道"
      params:
        channel_type: { type: "string", enum: ["Serial", "Ble"] }
        device_id: { type: "string" }
        characteristic_uuid: { type: "string", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "config_rx_channel"
      description: "配置RX通道"
      params:
        channel_type: { type: "string", enum: ["Serial", "Ble"] }
        device_id: { type: "string" }
        characteristic_uuid: { type: "string", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "execute_rpc"
      description: "执行RPC命令"
      params:
        command_key: { type: "string" }
        params: { type: "array<string>" }
      returns:
        success: { type: "boolean" }
        result: { type: "array<number>", optional: true }
        error: { type: "string", optional: true }

    - command: "config_csv"
      description: "配置CSV保存"
      params:
        enabled: { type: "boolean" }
        output_dir: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

  protocol_commands:
    - command: "load_plugin"
      description: "加载协议插件"
      params:
        plugin_id: { type: "string" }
        path: { type: "string" }
      returns:
        success: { type: "boolean" }
        plugin_info:
          type: "object"
          optional: true
          properties:
            id: { type: "string" }
            name: { type: "string" }
            version: { type: "string" }
        error: { type: "string", optional: true }

    - command: "unload_plugin"
      description: "卸载协议插件"
      params:
        plugin_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "enable_plugin"
      description: "启用协议插件"
      params:
        plugin_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "disable_plugin"
      description: "禁用协议插件"
      params:
        plugin_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "bind_device"
      description: "绑定设备到插件"
      params:
        plugin_id: { type: "string" }
        device_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "unbind_device"
      description: "解绑设备"
      params:
        plugin_id: { type: "string" }
        device_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

  waveform_commands:
    - command: "create_buffer"
      description: "创建波形缓冲区"
      params:
        buffer_id: { type: "string" }
        capacity: { type: "number", default: 10000 }
        column_count: { type: "number" }
        column_names: { type: "array<string>" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "clear_buffer"
      description: "清空波形缓冲区"
      params:
        buffer_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "config_buffer"
      description: "配置波形缓冲区"
      params:
        buffer_id: { type: "string" }
        capacity: { type: "number", optional: true }
        column_names: { type: "array<string>", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "create_parser"
      description: "创建波形解析器"
      params:
        buffer_id: { type: "string" }
        parser_type: { type: "string", enum: ["csv", "json", "binary", "custom"] }
        parser_config: { type: "object" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

  dashboard_commands:
    - command: "save_parser_script"
      description: "保存解析脚本"
      params:
        script_id: { type: "string" }
        name: { type: "string" }
        description: { type: "string", optional: true }
        content: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "delete_parser_script"
      description: "删除解析脚本"
      params:
        script_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "execute_parser_script"
      description: "执行解析脚本"
      params:
        script_id: { type: "string" }
        input_data: { type: "string" }
      returns:
        success: { type: "boolean" }
        result: { type: "object", optional: true }
        error: { type: "string", optional: true }

    - command: "save_json_config"
      description: "保存JSON配置"
      params:
        config_id: { type: "string" }
        name: { type: "string" }
        description: { type: "string", optional: true }
        content: { type: "object" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "delete_json_config"
      description: "删除JSON配置"
      params:
        config_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

state_query_commands:
  description: "状态查询 - 通过 Tauri Command 实现（直接方法调用）"
  
  device_queries:
    - command: "get_serial_ports"
      description: "获取串口列表"
      params: {}
      returns:
        ports:
          type: "array"
          items:
            port_name: { type: "string" }
            description: { type: "string" }
            manufacturer: { type: "string" }
            available: { type: "boolean" }

    - command: "get_serial_status"
      description: "获取串口状态"
      params:
        port_name: { type: "string" }
      returns:
        connected: { type: "boolean" }
        config: { type: "object" }
        stats:
          type: "object"
          properties:
            bytes_sent: { type: "number" }
            bytes_received: { type: "number" }
            last_activity: { type: "number" }

    - command: "get_ble_devices"
      description: "获取BLE设备列表"
      params: {}
      returns:
        devices:
          type: "array"
          items:
            address: { type: "string" }
            name: { type: "string" }
            rssi: { type: "number" }
            connected: { type: "boolean" }

    - command: "get_ble_device_status"
      description: "获取BLE设备状态"
      params:
        address: { type: "string" }
      returns:
        connected: { type: "boolean" }
        name: { type: "string" }
        rssi: { type: "number" }
        mtu: { type: "number" }
        services: { type: "array" }

    - command: "get_ble_services"
      description: "获取BLE设备服务列表"
      params:
        address: { type: "string" }
      returns:
        services:
          type: "array"
          items:
            uuid: { type: "string" }
            primary: { type: "boolean" }
            characteristics:
              type: "array"
              items:
                uuid: { type: "string" }
                properties: { type: "array<string>" }

  gh3036_queries:
    - command: "get_gh3036_status"
      description: "获取GH3036状态"
      params: {}
      returns:
        initialized: { type: "boolean" }
        library_linked: { type: "boolean" }
        tx_channel:
          type: "object"
          optional: true
          properties:
            channel_type: { type: "string" }
            device_id: { type: "string" }
        rx_channel:
          type: "object"
          optional: true
          properties:
            channel_type: { type: "string" }
            device_id: { type: "string" }
        csv_config:
          type: "object"
          properties:
            enabled: { type: "boolean" }
            output_dir: { type: "string" }

  protocol_queries:
    - command: "get_plugin_list"
      description: "获取插件列表"
      params: {}
      returns:
        plugins:
          type: "array"
          items:
            id: { type: "string" }
            name: { type: "string" }
            version: { type: "string" }
            state:
              type: "string"
              enum: ["Unloaded", "Loaded", "Enabled", "Disabled", "Error"]
            bound_devices: { type: "array<string>" }
            error_message: { type: "string", optional: true }

    - command: "get_plugin_status"
      description: "获取插件状态"
      params:
        plugin_id: { type: "string" }
      returns:
        id: { type: "string" }
        name: { type: "string" }
        version: { type: "string" }
        state: { type: "string" }
        bound_devices: { type: "array<string>" }
        error_message: { type: "string", optional: true }

  waveform_queries:
    - command: "get_buffer_status"
      description: "获取缓冲区状态"
      params:
        buffer_id: { type: "string" }
      returns:
        row_count: { type: "number" }
        column_count: { type: "number" }
        column_names: { type: "array<string>" }
        capacity: { type: "number" }
        parser_type: { type: "string", optional: true }

  dashboard_queries:
    - command: "get_parser_scripts"
      description: "获取解析脚本列表"
      params: {}
      returns:
        scripts:
          type: "array"
          items:
            id: { type: "string" }
            name: { type: "string" }
            description: { type: "string", optional: true }
            created_at: { type: "number" }
            updated_at: { type: "number" }

    - command: "get_parser_script"
      description: "获取解析脚本内容"
      params:
        script_id: { type: "string" }
      returns:
        id: { type: "string" }
        name: { type: "string" }
        content: { type: "string" }

    - command: "get_json_configs"
      description: "获取JSON配置列表"
      params: {}
      returns:
        configs:
          type: "array"
          items:
            id: { type: "string" }
            name: { type: "string" }
            description: { type: "string", optional: true }
            created_at: { type: "number" }
            updated_at: { type: "number" }

    - command: "get_json_config"
      description: "获取JSON配置内容"
      params:
        config_id: { type: "string" }
      returns:
        id: { type: "string" }
        name: { type: "string" }
        content: { type: "object" }

  system_queries:
    - command: "get_system_health"
      description: "获取系统健康状态"
      params: {}
      returns:
        status:
          type: "string"
          enum: ["healthy", "degraded", "unhealthy"]
        uptime_ms: { type: "number" }
        cpu_usage: { type: "number", optional: true }
        memory_usage: { type: "number", optional: true }
        active_connections:
          type: "object"
          properties:
            serial: { type: "number" }
            ble: { type: "number" }

    - command: "get_config"
      description: "获取配置"
      params:
        config_key: { type: "string", optional: true }
      returns:
        config: { type: "object" }

    - command: "set_config"
      description: "设置配置"
      params:
        config_key: { type: "string" }
        config_value: { type: "object" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

event_subscriptions:
  description: "模块间事件订阅关系（仅数据流）"
  
  Gh3036Manager:
    module: "gh3036::manager"
    subscribes:
      - topic: "serial:data"
        description: "订阅串口数据（TX/RX通道）"
      - topic: "ble:data"
        description: "订阅BLE数据（TX/RX通道）"

  PluginManager:
    module: "protocol::plugin_manager"
    subscribes:
      - topic: "serial:data"
        description: "订阅串口数据进行协议解析"
      - topic: "ble:data"
        description: "订阅BLE数据进行协议解析"

  WaveformManager:
    module: "waveform::buffer"
    subscribes:
      - topic: "protocol:parsed"
        description: "订阅协议解析结果用于波形显示"
      - topic: "gh3036:frame"
        description: "订阅GH3036帧数据"

event_publishers:
  description: "事件发布者清单"
  
  SerialManager:
    module: "device::serial::serial_manager"
    publishes:
      - "serial:data"
      - "serial:connected"
      - "serial:disconnected"
      - "serial:error"

  BleManager:
    module: "device::ble::ble_manager"
    publishes:
      - "ble:data"
      - "ble:connected"
      - "ble:disconnected"
      - "ble:discovered"
      - "ble:scan:status"
      - "ble:error"

  Gh3036Manager:
    module: "gh3036::manager"
    publishes:
      - "gh3036:frame"
      - "gh3036:event"
      - "gh3036:channel:changed"

  PluginManager:
    module: "protocol::plugin_manager"
    publishes:
      - "protocol:parsed"
      - "protocol:error"

  WaveformManager:
    module: "waveform::buffer"
    publishes:
      - "waveform:data"
      - "waveform:status"

  DashboardManager:
    module: "dashboard::mod"
    publishes:
      - "dashboard:parser:updated"
      - "dashboard:json:updated"

  SystemManager:
    module: "service::system"
    publishes:
      - "system:started"
      - "system:shutdown"
      - "system:config:changed"
      - "system:error"
