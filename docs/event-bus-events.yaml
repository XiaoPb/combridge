      - topic: "ble/+/+/data"
        description: "订阅所有BLE数据进行协议解析"
      - topic: "protocol/plugin/load/request"
      - topic: "protocol/plugin/{plugin_id}/unload/request"
      - topic: "protocol/plugin/{plugin_id}/enable/request"
      - topic: "protocol/plugin/{plugin_id}/disable/request"
