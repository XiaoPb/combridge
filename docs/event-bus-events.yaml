    subscribes:
      - topic: "serial/list/request"
      - topic: "serial/{port_name}/status/request"
      - topic: "serial/{port_name}/write/request"
      - topic: "serial/open/request"
      - topic: "serial/{port_name}/close/request"
      - topic: "serial/{port_name}/config/request"

  BleManager:
    module: "device::ble::ble_manager"
    subscribes:
      - topic: "ble/scan/request"
      - topic: "ble/connect/request"
      - topic: "ble/{address}/disconnect/request"
      - topic: "ble/{address}/status/request"
      - topic: "ble/{address}/services/request"
      - topic: "ble/{address}/{characteristic_uuid}/read/request"
      - topic: "ble/{address}/{characteristic_uuid}/write/request"
      - topic: "ble/{address}/{characteristic_uuid}/subscribe/request"
      - topic: "ble/{address}/{characteristic_uuid}/unsubscribe/request"
      - topic: "ble/{address}/rssi/request"

