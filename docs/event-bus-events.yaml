event_bus:
  description: "ComBridge 事件总线配置文档 - 精简版"
  version: "3.0.0"
  last_updated: "2026-04-15"
  
  design_principles:
    data_flow: "Event Bus 广播（一对多）"
    control_flow: "Tauri Command（点对点）"
    state_query: "Tauri Command（直接方法调用）"
    
  removed_features:
    - "请求-响应模式 → 改用 Tauri Command"
    - "通配符订阅 → 前端自行过滤"
    - "retain 消息 → 前端缓存状态"
    - "QoS 级别 → 本地事件总线不需要"

tauri_events:
  event_bus_channel:
    name: "event-bus"
    description: "统一事件总线通道，所有后端事件通过此通道转发到前端"
    direction: "backend_to_frontend"
    payload_schema:
      topic:
        type: "string"
        description: "事件主题"
      payload:
        type: "object"
        description: "事件载荷"
      timestamp:
        type: "number"
        description: "时间戳（毫秒）"

data_flow_events:
  description: "数据流事件 - 通过 Event Bus 广播（一对多）"
  
  serial_events:
    serial_data:
      topic: "serial/{port_name}/data"
      description: "串口接收原始数据事件"
      publisher: "SerialManager"
      payload:
        port_name:
          type: "string"
          example: "COM1"
        data:
          type: "array<number>"
          description: "接收数据（字节数组）"
        timestamp:
          type: "number"

    serial_connected:
      topic: "serial/{port_name}/connected"
      description: "串口连接成功事件"
      publisher: "SerialManager"
      payload:
        port_name:
          type: "string"
        config:
          type: "object"
          properties:
            baud_rate: { type: "number" }
            data_bits: { type: "number" }
            parity: { type: "string" }
            stop_bits: { type: "number" }
        timestamp:
          type: "number"

    serial_disconnected:
      topic: "serial/{port_name}/disconnected"
      description: "串口断开连接事件"
      publisher: "SerialManager"
      payload:
        port_name:
          type: "string"
        reason:
          type: "string"
        timestamp:
          type: "number"

    serial_error:
      topic: "serial/{port_name}/error"
      description: "串口错误事件"
      publisher: "SerialManager"
      payload:
        port_name:
          type: "string"
        error_code:
          type: "string"
        error_message:
          type: "string"
        timestamp:
          type: "number"

  ble_events:
    ble_data:
      topic: "ble/{address}/{characteristic_uuid}/data"
      description: "BLE特征值数据事件"
      publisher: "BleManager"
      payload:
        address:
          type: "string"
        name:
          type: "string"
          optional: true
        characteristic_uuid:
          type: "string"
        data:
          type: "array<number>"
        timestamp:
          type: "number"

    ble_connected:
      topic: "ble/{address}/connected"
      description: "BLE设备连接成功事件"
      publisher: "BleManager"
      payload:
        address:
          type: "string"
        name:
          type: "string"
        rssi:
          type: "number"
        services:
          type: "array<string>"
        timestamp:
          type: "number"

    ble_disconnected:
      topic: "ble/{address}/disconnected"
      description: "BLE设备断开连接事件"
      publisher: "BleManager"
      payload:
        address:
          type: "string"
        name:
          type: "string"
        reason:
          type: "string"
        timestamp:
          type: "number"

    ble_discovered:
      topic: "ble/discovered"
      description: "BLE设备发现事件（扫描期间）"
      publisher: "BleManager"
      payload:
        address:
          type: "string"
        name:
          type: "string"
        rssi:
          type: "number"
        advertised_data:
          type: "object"
        timestamp:
          type: "number"

    ble_scan_status:
      topic: "ble/scan/status"
      description: "BLE扫描状态事件"
      publisher: "BleManager"
      payload:
        scanning:
          type: "boolean"
        devices_found:
          type: "number"
        timestamp:
          type: "number"

    ble_error:
      topic: "ble/{address}/error"
      description: "BLE错误事件"
      publisher: "BleManager"
      payload:
        address:
          type: "string"
          optional: true
        operation:
          type: "string"
        error_code:
          type: "string"
        error_message:
          type: "string"
        timestamp:
          type: "number"

  gh3036_events:
    gh3036_frame:
      topic: "gh3036/frame"
      description: "GH3036帧数据事件"
      publisher: "Gh3036Manager"
      payload:
        function_id:
          type: "number"
        function_name:
          type: "string"
        frame_id:
          type: "number"
        channel_count:
          type: "number"
        channels:
          type: "array<number>"
        timestamp:
          type: "number"

    gh3036_event:
      topic: "gh3036/event"
      description: "GH3036通用事件"
      publisher: "Gh3036Manager"
      payload:
        event_type:
          type: "string"
          enum: ["initialized", "started", "stopped", "error"]
        data:
          type: "object"
        timestamp:
          type: "number"

    gh3036_channel_changed:
      topic: "gh3036/channel/changed"
      description: "TX/RX通道变更事件"
      publisher: "Gh3036Manager"
      payload:
        channel_type:
          type: "string"
          enum: ["tx", "rx"]
        device_id:
          type: "string"
        channel_config:
          type: "object"
          properties:
            channel_type: { type: "string" }
            device_id: { type: "string" }
            characteristic_uuid: { type: "string", optional: true }
        timestamp:
          type: "number"

  protocol_events:
    protocol_parsed:
      topic: "protocol/{plugin_id}/parsed"
      description: "协议解析结果事件"
      publisher: "PluginManager"
      payload:
        plugin_id:
          type: "string"
        device_id:
          type: "string"
        original_data:
          type: "array<number>"
        parsed_data:
          type: "object"
        timestamp:
          type: "number"

    protocol_error:
      topic: "protocol/{plugin_id}/error"
      description: "协议解析错误事件"
      publisher: "PluginManager"
      payload:
        plugin_id:
          type: "string"
        device_id:
          type: "string"
          optional: true
        error_code:
          type: "string"
        error_message:
          type: "string"
        timestamp:
          type: "number"

  waveform_events:
    waveform_data:
      topic: "waveform/{buffer_id}/data"
      description: "波形数据更新事件"
      publisher: "WaveformManager"
      payload:
        buffer_id:
          type: "string"
        columns:
          type: "array<string>"
        rows:
          type: "array<array<number>>"
        timestamp:
          type: "number"

    waveform_status:
      topic: "waveform/{buffer_id}/status"
      description: "缓冲区状态变化事件"
      publisher: "WaveformManager"
      payload:
        buffer_id:
          type: "string"
        row_count:
          type: "number"
        column_count:
          type: "number"
        capacity:
          type: "number"
        timestamp:
          type: "number"

  dashboard_events:
    dashboard_parser_updated:
      topic: "dashboard/parser/{script_id}/updated"
      description: "解析脚本更新事件"
      publisher: "DashboardManager"
      payload:
        script_id:
          type: "string"
        content:
          type: "string"
        timestamp:
          type: "number"

    dashboard_json_updated:
      topic: "dashboard/json/{config_id}/updated"
      description: "JSON配置更新事件"
      publisher: "DashboardManager"
      payload:
        config_id:
          type: "string"
        content:
          type: "object"
        timestamp:
          type: "number"

  system_events:
    system_started:
      topic: "system/started"
      description: "应用启动完成事件"
      publisher: "SystemManager"
      payload:
        version:
          type: "string"
        startup_time_ms:
          type: "number"
        timestamp:
          type: "number"

    system_shutdown:
      topic: "system/shutdown"
      description: "应用关闭事件"
      publisher: "SystemManager"
      payload:
        reason:
          type: "string"
          enum: ["user_request", "error", "update", "system"]
        timestamp:
          type: "number"

    system_config_changed:
      topic: "system/config/changed"
      description: "配置变更事件"
      publisher: "SystemManager"
      payload:
        config_key:
          type: "string"
        old_value:
          type: "object"
          optional: true
        new_value:
          type: "object"
          optional: true
        timestamp:
          type: "number"

    system_error:
      topic: "system/error"
      description: "系统错误事件"
      publisher: "SystemManager"
      payload:
        error_code:
          type: "string"
        error_message:
          type: "string"
        context:
          type: "object"
          optional: true
        timestamp:
          type: "number"

control_flow_commands:
  description: "控制流 - 通过 Tauri Command 实现（点对点）"
  
  serial_commands:
    - command: "open_port"
      description: "打开串口"
      params:
        port_name: { type: "string" }
        baud_rate: { type: "number", default: 115200 }
        data_bits: { type: "number", default: 8 }
        parity: { type: "string", default: "none" }
        stop_bits: { type: "number", default: 1 }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "close_port"
      description: "关闭串口"
      params:
        port_name: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "write_data"
      description: "写入数据到串口"
      params:
        port_name: { type: "string" }
        data: { type: "array<number>" }
      returns:
        success: { type: "boolean" }
        bytes_written: { type: "number" }
        error: { type: "string", optional: true }

    - command: "config_port"
      description: "配置串口参数"
      params:
        port_name: { type: "string" }
        baud_rate: { type: "number", optional: true }
        data_bits: { type: "number", optional: true }
        parity: { type: "string", optional: true }
        stop_bits: { type: "number", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

  ble_commands:
    - command: "start_scan"
      description: "开始BLE扫描"
      params:
        duration_ms: { type: "number", default: 5000 }
        service_uuids: { type: "array<string>", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "stop_scan"
      description: "停止BLE扫描"
      params: {}
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "connect_device"
      description: "连接BLE设备"
      params:
        address: { type: "string" }
        timeout_ms: { type: "number", default: 10000 }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "disconnect_device"
      description: "断开BLE设备"
      params:
        address: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "read_characteristic"
      description: "读取BLE特征值"
      params:
        address: { type: "string" }
        service_uuid: { type: "string" }
        characteristic_uuid: { type: "string" }
      returns:
        success: { type: "boolean" }
        data: { type: "array<number>", optional: true }
        error: { type: "string", optional: true }

    - command: "write_characteristic"
      description: "写入BLE特征值"
      params:
        address: { type: "string" }
        service_uuid: { type: "string" }
        characteristic_uuid: { type: "string" }
        data: { type: "array<number>" }
        write_type: { type: "string", default: "with_response" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "subscribe_characteristic"
      description: "订阅BLE特征值通知"
      params:
        address: { type: "string" }
        service_uuid: { type: "string" }
        characteristic_uuid: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "unsubscribe_characteristic"
      description: "取消订阅BLE特征值通知"
      params:
        address: { type: "string" }
        service_uuid: { type: "string" }
        characteristic_uuid: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

  gh3036_commands:
    - command: "config_tx_channel"
      description: "配置TX通道"
      params:
        channel_type: { type: "string", enum: ["Serial", "Ble"] }
        device_id: { type: "string" }
        characteristic_uuid: { type: "string", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "config_rx_channel"
      description: "配置RX通道"
      params:
        channel_type: { type: "string", enum: ["Serial", "Ble"] }
        device_id: { type: "string" }
        characteristic_uuid: { type: "string", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "execute_rpc"
      description: "执行RPC命令"
      params:
        command_key: { type: "string" }
        params: { type: "array<string>" }
      returns:
        success: { type: "boolean" }
        result: { type: "array<number>", optional: true }
        error: { type: "string", optional: true }

    - command: "config_csv"
      description: "配置CSV保存"
      params:
        enabled: { type: "boolean" }
        output_dir: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

  protocol_commands:
    - command: "load_plugin"
      description: "加载协议插件"
      params:
        plugin_id: { type: "string" }
        path: { type: "string" }
      returns:
        success: { type: "boolean" }
        plugin_info:
          type: "object"
          optional: true
          properties:
            id: { type: "string" }
            name: { type: "string" }
            version: { type: "string" }
        error: { type: "string", optional: true }

    - command: "unload_plugin"
      description: "卸载协议插件"
      params:
        plugin_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "enable_plugin"
      description: "启用协议插件"
      params:
        plugin_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "disable_plugin"
      description: "禁用协议插件"
      params:
        plugin_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "bind_device"
      description: "绑定设备到插件"
      params:
        plugin_id: { type: "string" }
        device_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "unbind_device"
      description: "解绑设备"
      params:
        plugin_id: { type: "string" }
        device_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

  waveform_commands:
    - command: "create_buffer"
      description: "创建波形缓冲区"
      params:
        buffer_id: { type: "string" }
        capacity: { type: "number", default: 10000 }
        column_count: { type: "number" }
        column_names: { type: "array<string>" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "clear_buffer"
      description: "清空波形缓冲区"
      params:
        buffer_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "config_buffer"
      description: "配置波形缓冲区"
      params:
        buffer_id: { type: "string" }
        capacity: { type: "number", optional: true }
        column_names: { type: "array<string>", optional: true }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "create_parser"
      description: "创建波形解析器"
      params:
        buffer_id: { type: "string" }
        parser_type: { type: "string", enum: ["csv", "json", "binary", "custom"] }
        parser_config: { type: "object" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

  dashboard_commands:
    - command: "save_parser_script"
      description: "保存解析脚本"
      params:
        script_id: { type: "string" }
        name: { type: "string" }
        description: { type: "string", optional: true }
        content: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "delete_parser_script"
      description: "删除解析脚本"
      params:
        script_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "execute_parser_script"
      description: "执行解析脚本"
      params:
        script_id: { type: "string" }
        input_data: { type: "string" }
      returns:
        success: { type: "boolean" }
        result: { type: "object", optional: true }
        error: { type: "string", optional: true }

    - command: "save_json_config"
      description: "保存JSON配置"
      params:
        config_id: { type: "string" }
        name: { type: "string" }
        description: { type: "string", optional: true }
        content: { type: "object" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

    - command: "delete_json_config"
      description: "删除JSON配置"
      params:
        config_id: { type: "string" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

state_query_commands:
  description: "状态查询 - 通过 Tauri Command 实现（直接方法调用）"
  
  device_queries:
    - command: "get_serial_ports"
      description: "获取串口列表"
      params: {}
      returns:
        ports:
          type: "array"
          items:
            port_name: { type: "string" }
            description: { type: "string" }
            manufacturer: { type: "string" }
            available: { type: "boolean" }

    - command: "get_serial_status"
      description: "获取串口状态"
      params:
        port_name: { type: "string" }
      returns:
        connected: { type: "boolean" }
        config: { type: "object" }
        stats:
          type: "object"
          properties:
            bytes_sent: { type: "number" }
            bytes_received: { type: "number" }
            last_activity: { type: "number" }

    - command: "get_ble_devices"
      description: "获取BLE设备列表"
      params: {}
      returns:
        devices:
          type: "array"
          items:
            address: { type: "string" }
            name: { type: "string" }
            rssi: { type: "number" }
            connected: { type: "boolean" }

    - command: "get_ble_device_status"
      description: "获取BLE设备状态"
      params:
        address: { type: "string" }
      returns:
        connected: { type: "boolean" }
        name: { type: "string" }
        rssi: { type: "number" }
        mtu: { type: "number" }
        services: { type: "array" }

    - command: "get_ble_services"
      description: "获取BLE设备服务列表"
      params:
        address: { type: "string" }
      returns:
        services:
          type: "array"
          items:
            uuid: { type: "string" }
            primary: { type: "boolean" }
            characteristics:
              type: "array"
              items:
                uuid: { type: "string" }
                properties: { type: "array<string>" }

  gh3036_queries:
    - command: "get_gh3036_status"
      description: "获取GH3036状态"
      params: {}
      returns:
        initialized: { type: "boolean" }
        library_linked: { type: "boolean" }
        tx_channel:
          type: "object"
          optional: true
          properties:
            channel_type: { type: "string" }
            device_id: { type: "string" }
        rx_channel:
          type: "object"
          optional: true
          properties:
            channel_type: { type: "string" }
            device_id: { type: "string" }
        csv_config:
          type: "object"
          properties:
            enabled: { type: "boolean" }
            output_dir: { type: "string" }

  protocol_queries:
    - command: "get_plugin_list"
      description: "获取插件列表"
      params: {}
      returns:
        plugins:
          type: "array"
          items:
            id: { type: "string" }
            name: { type: "string" }
            version: { type: "string" }
            state:
              type: "string"
              enum: ["Unloaded", "Loaded", "Enabled", "Disabled", "Error"]
            bound_devices: { type: "array<string>" }
            error_message: { type: "string", optional: true }

    - command: "get_plugin_status"
      description: "获取插件状态"
      params:
        plugin_id: { type: "string" }
      returns:
        id: { type: "string" }
        name: { type: "string" }
        version: { type: "string" }
        state: { type: "string" }
        bound_devices: { type: "array<string>" }
        error_message: { type: "string", optional: true }

  waveform_queries:
    - command: "get_buffer_status"
      description: "获取缓冲区状态"
      params:
        buffer_id: { type: "string" }
      returns:
        row_count: { type: "number" }
        column_count: { type: "number" }
        column_names: { type: "array<string>" }
        capacity: { type: "number" }
        parser_type: { type: "string", optional: true }

  dashboard_queries:
    - command: "get_parser_scripts"
      description: "获取解析脚本列表"
      params: {}
      returns:
        scripts:
          type: "array"
          items:
            id: { type: "string" }
            name: { type: "string" }
            description: { type: "string", optional: true }
            created_at: { type: "number" }
            updated_at: { type: "number" }

    - command: "get_parser_script"
      description: "获取解析脚本内容"
      params:
        script_id: { type: "string" }
      returns:
        id: { type: "string" }
        name: { type: "string" }
        content: { type: "string" }

    - command: "get_json_configs"
      description: "获取JSON配置列表"
      params: {}
      returns:
        configs:
          type: "array"
          items:
            id: { type: "string" }
            name: { type: "string" }
            description: { type: "string", optional: true }
            created_at: { type: "number" }
            updated_at: { type: "number" }

    - command: "get_json_config"
      description: "获取JSON配置内容"
      params:
        config_id: { type: "string" }
      returns:
        id: { type: "string" }
        name: { type: "string" }
        content: { type: "object" }

  system_queries:
    - command: "get_system_health"
      description: "获取系统健康状态"
      params: {}
      returns:
        status:
          type: "string"
          enum: ["healthy", "degraded", "unhealthy"]
        uptime_ms: { type: "number" }
        cpu_usage: { type: "number", optional: true }
        memory_usage: { type: "number", optional: true }
        active_connections:
          type: "object"
          properties:
            serial: { type: "number" }
            ble: { type: "number" }

    - command: "get_config"
      description: "获取配置"
      params:
        config_key: { type: "string", optional: true }
      returns:
        config: { type: "object" }

    - command: "set_config"
      description: "设置配置"
      params:
        config_key: { type: "string" }
        config_value: { type: "object" }
      returns:
        success: { type: "boolean" }
        error: { type: "string", optional: true }

event_subscriptions:
  description: "模块间事件订阅关系（仅数据流）"
  
  Gh3036Manager:
    module: "gh3036::manager"
    subscribes:
      - topic: "serial/{port_name}/data"
        description: "订阅串口数据（TX/RX通道）"
      - topic: "ble/{address}/{characteristic_uuid}/data"
        description: "订阅BLE数据（TX/RX通道）"

  PluginManager:
    module: "protocol::plugin_manager"
    subscribes:
      - topic: "serial/{port_name}/data"
        description: "订阅串口数据进行协议解析"
      - topic: "ble/{address}/{characteristic_uuid}/data"
        description: "订阅BLE数据进行协议解析"

  WaveformManager:
    module: "waveform::buffer"
    subscribes:
      - topic: "protocol/{plugin_id}/parsed"
        description: "订阅协议解析结果用于波形显示"
      - topic: "gh3036/frame"
        description: "订阅GH3036帧数据"

event_publishers:
  description: "事件发布者清单"
  
  SerialManager:
    module: "device::serial::serial_manager"
    publishes:
      - "serial/{port_name}/data"
      - "serial/{port_name}/connected"
      - "serial/{port_name}/disconnected"
      - "serial/{port_name}/error"

  BleManager:
    module: "device::ble::ble_manager"
    publishes:
      - "ble/{address}/{characteristic_uuid}/data"
      - "ble/{address}/connected"
      - "ble/{address}/disconnected"
      - "ble/discovered"
      - "ble/scan/status"
      - "ble/{address}/error"

  Gh3036Manager:
    module: "gh3036::manager"
    publishes:
      - "gh3036/frame"
      - "gh3036/event"
      - "gh3036/channel/changed"

  PluginManager:
    module: "protocol::plugin_manager"
    publishes:
      - "protocol/{plugin_id}/parsed"
      - "protocol/{plugin_id}/error"

  WaveformManager:
    module: "waveform::buffer"
    publishes:
      - "waveform/{buffer_id}/data"
      - "waveform/{buffer_id}/status"

  DashboardManager:
    module: "dashboard::mod"
    publishes:
      - "dashboard/parser/{script_id}/updated"
      - "dashboard/json/{config_id}/updated"

  SystemManager:
    module: "service::system"
    publishes:
      - "system/started"
      - "system/shutdown"
      - "system/config/changed"
      - "system/error"
