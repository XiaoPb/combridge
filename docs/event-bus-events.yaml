event_bus:
  description: "ComBridge 事件总线配置文档"
  version: "2.0.0"
  last_updated: "2026-04-14"
  features:
    - "通配符订阅 (支持 + 和 #)"
    - "设备级细粒度订阅"
    - "请求-响应模式"
    - "设备状态查询"
    - "操作命令发布"

# ==================== 通配符规则 ====================
wildcard_rules:
  "+": "单级通配符，匹配任意一个层级"
  "#": "多级通配符，匹配剩余所有层级"
  examples:
    - "serial:+/data"        # 匹配 serial:COM1/data, serial:COM2/data
    - "serial:#"             # 匹配所有 serial 开头的主题
    - "ble:+/+/data"         # 匹配 ble:AA:BB:CC:DD:EE:FF/characteristic_uuid/data
    - "+:connected"          # 匹配所有模块的 connected 事件

# ==================== Tauri 事件通道 ====================
tauri_events:
  - name: "event-bus"
    description: "统一事件总线通道，所有后端事件通过此通道转发到前端"
    direction: "backend_to_frontend"
    payload_schema:
      topic:
        type: "string"
        description: "事件主题，支持通配符订阅"
      payload:
        type: "object"
        description: "事件载荷"
      timestamp:
        type: "number"
        description: "时间戳（毫秒）"

  - name: "event-bus-request"
    description: "前端请求通道，用于向前端发送操作结果"
    direction: "backend_to_frontend"

  - name: "event-bus-response"
    description: "前端响应通道，用于后端请求的响应"
    direction: "frontend_to_backend"

# ==================== 串口相关主题 ====================
serial_topics:
  # ----- 事件类（设备 -> 系统）-----
  serial_data:
    name: "serial/{port_name}/data"
    description: "串口接收原始数据事件，支持按端口名订阅"
    qos: 1
    retain: false
    payload:
      port_name:
        type: "string"
        description: "端口名称"
        example: "COM1"
      data:
        type: "array<number>"
        description: "接收数据（字节数组）"
      timestamp:
        type: "number"

  serial_data_hex:
    name: "serial/{port_name}/data/hex"
    description: "串口接收数据（十六进制字符串格式）"
    payload:
      port_name:
        type: "string"
      data_hex:
        type: "string"
        description: "十六进制数据字符串"
        example: "01 02 03 04 05"
      timestamp:
        type: "number"

  serial_connected:
    name: "serial/{port_name}/connected"
    description: "串口连接成功事件"
    retain: true
    payload:
      port_name:
        type: "string"
      config:
        type: "object"
        description: "串口配置"
        properties:
          baud_rate: { type: "number" }
          data_bits: { type: "number" }
          parity: { type: "string" }
          stop_bits: { type: "number" }
      timestamp:
        type: "number"

  serial_disconnected:
    name: "serial/{port_name}/disconnected"
    description: "串口断开连接事件"
    retain: true
    payload:
      port_name:
        type: "string"
      reason:
        type: "string"
        description: "断开原因"
      timestamp:
        type: "number"

  serial_error:
    name: "serial/{port_name}/error"
    description: "串口错误事件"
    payload:
      port_name:
        type: "string"
      error_code:
        type: "string"
      error_message:
        type: "string"
      timestamp:
        type: "number"

  # ----- 状态类（查询响应）-----
  serial_list_response:
    name: "serial/list/response"
    description: "串口列表查询响应"
    response_to: "serial/list/request"
    payload:
      request_id:
        type: "string"
      ports:
        type: "array"
        items:
          port_name: { type: "string" }
          description: { type: "string" }
          manufacturer: { type: "string" }
          serial_number: { type: "string" }
          product_id: { type: "string" }
          vendor_id: { type: "string" }
          available: { type: "boolean" }
      timestamp:
        type: "number"

  serial_status_response:
    name: "serial/{port_name}/status/response"
    description: "串口状态查询响应"
    response_to: "serial/{port_name}/status/request"
    payload:
      request_id:
        type: "string"
      port_name:
        type: "string"
      connected:
        type: "boolean"
      config:
        type: "object"
      stats:
        type: "object"
        properties:
          bytes_sent: { type: "number" }
          bytes_received: { type: "number" }
          last_activity: { type: "number" }
      timestamp:
        type: "number"

  # ----- 命令类（系统 -> 设备）-----
  serial_write_request:
    name: "serial/{port_name}/write/request"
    description: "串口写入请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
        description: "请求ID，用于匹配响应"
      port_name:
        type: "string"
      data:
        type: "array<number>"
      hex_string:
        type: "string"
        description: "十六进制字符串，与 data 二选一"
      timeout_ms:
        type: "number"
        default: 5000

  serial_write_response:
    name: "serial/{port_name}/write/response"
    description: "串口写入响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      port_name:
        type: "string"
      success:
        type: "boolean"
      bytes_written:
        type: "number"
      error:
        type: "string"
        optional: true
      timestamp:
        type: "number"

  serial_open_request:
    name: "serial/open/request"
    description: "串口打开请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      port_name:
        type: "string"
      baud_rate:
        type: "number"
        default: 115200
      data_bits:
        type: "number"
        default: 8
      parity:
        type: "string"
        enum: ["none", "even", "odd"]
        default: "none"
      stop_bits:
        type: "number"
        enum: [1, 2]
        default: 1
      timeout:
        type: "number"
        default: 1000

  serial_open_response:
    name: "serial/open/response"
    description: "串口打开响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      port_name:
        type: "string"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  serial_close_request:
    name: "serial/{port_name}/close/request"
    description: "串口关闭请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      port_name:
        type: "string"

  serial_close_response:
    name: "serial/{port_name}/close/response"
    description: "串口关闭响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      port_name:
        type: "string"
      success:
        type: "boolean"

  serial_config_update_request:
    name: "serial/{port_name}/config/request"
    description: "串口配置更新请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      port_name:
        type: "string"
      baud_rate:
        type: "number"
        optional: true
      data_bits:
        type: "number"
        optional: true
      parity:
        type: "string"
        optional: true
      stop_bits:
        type: "number"
        optional: true

# ==================== BLE 相关主题 ====================
ble_topics:
  # ----- 事件类（设备 -> 系统）-----
  ble_data:
    name: "ble/{address}/{characteristic_uuid}/data"
    description: "BLE特征值数据事件，支持按设备地址和特征UUID订阅"
    qos: 1
    payload:
      address:
        type: "string"
        description: "设备地址"
      name:
        type: "string"
        optional: true
      characteristic_uuid:
        type: "string"
      data:
        type: "array<number>"
      data_hex:
        type: "string"
      timestamp:
        type: "number"

  ble_data_notify:
    name: "ble/{address}/{characteristic_uuid}/notify"
    description: "BLE特征值通知事件"
    payload:
      address:
        type: "string"
      characteristic_uuid:
        type: "string"
      data:
        type: "array<number>"
      timestamp:
        type: "number"

  ble_data_indicate:
    name: "ble/{address}/{characteristic_uuid}/indicate"
    description: "BLE特征值指示事件"
    payload:
      address:
        type: "string"
      characteristic_uuid:
        type: "string"
      data:
        type: "array<number>"
      timestamp:
        type: "number"

  ble_connected:
    name: "ble/{address}/connected"
    description: "BLE设备连接成功事件"
    retain: true
    payload:
      address:
        type: "string"
      name:
        type: "string"
      rssi:
        type: "number"
        description: "信号强度"
      services:
        type: "array<string>"
        description: "可用服务UUID列表"
      timestamp:
        type: "number"

  ble_disconnected:
    name: "ble/{address}/disconnected"
    description: "BLE设备断开连接事件"
    retain: true
    payload:
      address:
        type: "string"
      name:
        type: "string"
      reason:
        type: "string"
      timestamp:
        type: "number"

  ble_discovered:
    name: "ble/discovered"
    description: "BLE设备发现事件（扫描期间）"
    payload:
      address:
        type: "string"
      name:
        type: "string"
      rssi:
        type: "number"
      advertised_data:
        type: "object"
      timestamp:
        type: "number"

  ble_scan_started:
    name: "ble/scan/started"
    description: "BLE扫描开始事件"
    retain: true
    payload:
      duration_ms:
        type: "number"
      timestamp:
        type: "number"

  ble_scan_stopped:
    name: "ble/scan/stopped"
    description: "BLE扫描停止事件"
    retain: true
    payload:
      devices_found:
        type: "number"
      timestamp:
        type: "number"

  ble_error:
    name: "ble/{address}/error"
    description: "BLE错误事件"
    payload:
      address:
        type: "string"
        optional: true
      operation:
        type: "string"
        description: "发生错误的操作"
      error_code:
        type: "string"
      error_message:
        type: "string"
      timestamp:
        type: "number"

  # ----- 状态类 -----
  ble_device_status_response:
    name: "ble/{address}/status/response"
    description: "BLE设备状态查询响应"
    response_to: "ble/{address}/status/request"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      connected:
        type: "boolean"
      name:
        type: "string"
      rssi:
        type: "number"
      mtu:
        type: "number"
      services:
        type: "array"
      timestamp:
        type: "number"

  ble_services_response:
    name: "ble/{address}/services/response"
    description: "BLE服务发现响应"
    response_to: "ble/{address}/services/request"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      services:
        type: "array"
        items:
          uuid: { type: "string" }
          primary: { type: "boolean" }
          characteristics:
            type: "array"
            items:
              uuid: { type: "string" }
              properties:
                type: "array"
                items: { type: "string", enum: ["read", "write", "notify", "indicate"] }
      timestamp:
        type: "number"

  ble_scan_response:
    name: "ble/scan/response"
    description: "BLE扫描结果响应（批量）"
    response_to: "ble/scan/request"
    payload:
      request_id:
        type: "string"
      devices:
        type: "array"
        items:
          address: { type: "string" }
          name: { type: "string" }
          rssi: { type: "number" }
          connectable: { type: "boolean" }
      timestamp:
        type: "number"

  # ----- 命令类 -----
  ble_connect_request:
    name: "ble/connect/request"
    description: "BLE设备连接请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      timeout_ms:
        type: "number"
        default: 10000

  ble_connect_response:
    name: "ble/connect/response"
    description: "BLE连接响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  ble_disconnect_request:
    name: "ble/{address}/disconnect/request"
    description: "BLE设备断开请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"

  ble_disconnect_response:
    name: "ble/{address}/disconnect/response"
    description: "BLE断开响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      success:
        type: "boolean"

  ble_scan_request:
    name: "ble/scan/request"
    description: "BLE扫描请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      duration_ms:
        type: "number"
        default: 5000
      allow_duplicates:
        type: "boolean"
        default: false
      service_uuids:
        type: "array<string>"
        description: "过滤服务UUID"
        optional: true

  ble_read_request:
    name: "ble/{address}/{characteristic_uuid}/read/request"
    description: "BLE特征值读取请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      service_uuid:
        type: "string"
      characteristic_uuid:
        type: "string"

  ble_read_response:
    name: "ble/{address}/{characteristic_uuid}/read/response"
    description: "BLE特征值读取响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      characteristic_uuid:
        type: "string"
      success:
        type: "boolean"
      data:
        type: "array<number>"
        optional: true
      error:
        type: "string"
        optional: true

  ble_write_request:
    name: "ble/{address}/{characteristic_uuid}/write/request"
    description: "BLE特征值写入请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      service_uuid:
        type: "string"
      characteristic_uuid:
        type: "string"
      data:
        type: "array<number>"
      write_type:
        type: "string"
        enum: ["with_response", "without_response"]
        default: "with_response"

  ble_write_response:
    name: "ble/{address}/{characteristic_uuid}/write/response"
    description: "BLE特征值写入响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      characteristic_uuid:
        type: "string"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  ble_subscribe_request:
    name: "ble/{address}/{characteristic_uuid}/subscribe/request"
    description: "订阅BLE特征值通知/指示请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      service_uuid:
        type: "string"
      characteristic_uuid:
        type: "string"
      subscribe_type:
        type: "string"
        enum: ["notify", "indicate", "both"]

  ble_subscribe_response:
    name: "ble/{address}/{characteristic_uuid}/subscribe/response"
    description: "订阅BLE特征值响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      characteristic_uuid:
        type: "string"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  ble_unsubscribe_request:
    name: "ble/{address}/{characteristic_uuid}/unsubscribe/request"
    description: "取消订阅BLE特征值请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      service_uuid:
        type: "string"
      characteristic_uuid:
        type: "string"

  ble_unsubscribe_response:
    name: "ble/{address}/{characteristic_uuid}/unsubscribe/response"
    description: "取消订阅BLE特征值响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      characteristic_uuid:
        type: "string"
      success:
        type: "boolean"

  ble_rssi_read_request:
    name: "ble/{address}/rssi/request"
    description: "读取BLE设备RSSI请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"

  ble_rssi_read_response:
    name: "ble/{address}/rssi/response"
    description: "RSSI读取响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      address:
        type: "string"
      rssi:
        type: "number"
      success:
        type: "boolean"

# ==================== 通用系统主题 ====================
system_topics:
  device_list_request:
    name: "device/list/request"
    description: "获取所有设备列表请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      device_types:
        type: "array<string>"
        description: "过滤设备类型: serial, ble, all"
        optional: true

  device_list_response:
    name: "device/list/response"
    description: "设备列表响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      serial_ports:
        type: "array"
      ble_devices:
        type: "array"
      timestamp:
        type: "number"

  device_status_request:
    name: "device/{device_type}/{device_id}/status/request"
    description: "设备状态查询请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"

  health_check:
    name: "system/health"
    description: "系统健康检查事件"
    retain: true
    payload:
      status:
        type: "string"
        enum: ["healthy", "degraded", "unhealthy"]
      uptime_ms:
        type: "number"
      timestamp:
        type: "number"

# ==================== GH3036 相关主题 ====================
gh3036_topics:
  gh3036_frame:
    name: "gh3036/frame"
    description: "GH3036帧数据事件"
    payload:
      function_id:
        type: "number"
      function_name:
        type: "string"
      frame_id:
        type: "number"
      channel_count:
        type: "number"
      channels:
        type: "array<number>"
      timestamp:
        type: "number"

  gh3036_event:
    name: "gh3036/event"
    description: "GH3036通用事件"
    payload:
      event_type:
        type: "string"
        enum: ["initialized", "started", "stopped", "error"]
      data:
        type: "object"
      timestamp:
        type: "number"

  gh3036_rpc_result:
    name: "gh3036/rpc/result"
    description: "RPC命令执行结果事件"
    payload:
      command_key:
        type: "string"
      success:
        type: "boolean"
      result:
        type: "array<number>"
        optional: true
      error:
        type: "string"
        optional: true
      timestamp:
        type: "number"

  gh3036_channel_changed:
    name: "gh3036/channel/changed"
    description: "TX/RX通道变更事件"
    payload:
      channel_type:
        type: "string"
        enum: ["tx", "rx"]
      device_id:
        type: "string"
      channel_config:
        type: "object"
        properties:
          channel_type: { type: "string" }
          device_id: { type: "string" }
          characteristic_uuid: { type: "string", optional: true }
      timestamp:
        type: "number"

  gh3036_channel_tx_config_request:
    name: "gh3036/channel/tx/config/request"
    description: "配置TX通道请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      channel_type:
        type: "string"
        enum: ["Serial", "Ble"]
      device_id:
        type: "string"
      characteristic_uuid:
        type: "string"
        optional: true

  gh3036_channel_tx_config_response:
    name: "gh3036/channel/tx/config/response"
    description: "TX通道配置响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  gh3036_channel_rx_config_request:
    name: "gh3036/channel/rx/config/request"
    description: "配置RX通道请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      channel_type:
        type: "string"
        enum: ["Serial", "Ble"]
      device_id:
        type: "string"
      characteristic_uuid:
        type: "string"
        optional: true

  gh3036_channel_rx_config_response:
    name: "gh3036/channel/rx/config/response"
    description: "RX通道配置响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  gh3036_csv_config_request:
    name: "gh3036/csv/config/request"
    description: "配置CSV保存请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      enabled:
        type: "boolean"
      output_dir:
        type: "string"

  gh3036_csv_config_response:
    name: "gh3036/csv/config/response"
    description: "CSV配置响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  gh3036_rpc_execute_request:
    name: "gh3036/rpc/execute/request"
    description: "执行RPC命令请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      command_key:
        type: "string"
