# ==================== 扩展系统主题 ====================
extended_system_topics:
  system_started:
    name: "system/started"
    description: "应用启动完成事件"
    retain: true
    payload:
      version:
        type: "string"
      startup_time_ms:
        type: "number"
      timestamp:
        type: "number"

  system_shutdown:
    name: "system/shutdown"
    description: "应用关闭事件"
    retain: true
    payload:
      reason:
        type: "string"
        enum: ["user_request", "error", "update", "system"]
      grace_period_ms:
        type: "number"
      timestamp:
        type: "number"

  system_config_changed:
    name: "system/config/changed"
    description: "配置变更事件"
    payload:
      config_key:
        type: "string"
      old_value:
        type: "object"
        optional: true
      new_value:
        type: "object"
        optional: true
      timestamp:
        type: "number"

  system_log:
    name: "system/log"
    description: "系统日志事件"
    payload:
      level:
        type: "string"
        enum: ["trace", "debug", "info", "warn", "error"]
      message:
        type: "string"
      module:
        type: "string"
      timestamp:
        type: "number"

  system_error:
    name: "system/error"
    description: "系统错误事件"
    payload:
      error_code:
        type: "string"
      error_message:
        type: "string"
      context:
        type: "object"
        optional: true
      timestamp:
        type: "number"

  system_health_request:
    name: "system/health/request"
    description: "请求健康检查"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"

  system_health_response:
    name: "system/health/response"
    description: "健康检查响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      status:
        type: "string"
        enum: ["healthy", "degraded", "unhealthy"]
      uptime_ms:
        type: "number"
      cpu_usage:
        type: "number"
        optional: true
      memory_usage:
        type: "number"
        optional: true
      active_connections:
        type: "object"
        properties:
          serial: { type: "number" }
          ble: { type: "number" }
          websocket: { type: "number" }
      timestamp:
        type: "number"

  system_config_get_request:
    name: "system/config/get/request"
    description: "获取配置请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      config_key:
        type: "string"
        optional: true
        description: "不指定则返回所有配置"

  system_config_get_response:
    name: "system/config/get/response"
    description: "配置响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      config:
        type: "object"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  system_config_set_request:
    name: "system/config/set/request"
    description: "设置配置请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      config_key:
        type: "string"
      config_value:
        type: "object"

  system_config_set_response:
    name: "system/config/set/response"
    description: "设置配置响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      config_key:
        type: "string"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  system_shutdown_request:
    name: "system/shutdown/request"
    description: "请求关闭应用"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      reason:
        type: "string"
        default: "user_request"

  system_shutdown_response:
    name: "system/shutdown/response"
    description: "关闭应用响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      accepted:
        type: "boolean"

# ==================== 应用状态相关主题 ====================
state_topics:
  state_device_changed:
    name: "state/device/{device_id}/changed"
    description: "设备状态变更事件"
    payload:
      device_id:
        type: "string"
      property:
        type: "string"
        description: "变更的属性名"
      old_value:
        type: "object"
        optional: true
      new_value:
        type: "object"
        optional: true
      timestamp:
        type: "number"

  state_device_connected:
    name: "state/device/{device_id}/connected"
    description: "设备连接事件"
    payload:
      device_id:
        type: "string"
      device_type:
        type: "string"
        enum: ["serial", "ble"]
      timestamp:
        type: "number"

  state_device_disconnected:
    name: "state/device/{device_id}/disconnected"
    description: "设备断开事件"
    payload:
      device_id:
        type: "string"
      reason:
        type: "string"
      timestamp:
        type: "number"

  state_tab_created:
    name: "state/tab/created"
    description: "TAB创建事件"
    payload:
      tab_key:
        type: "string"
      device_id:
        type: "string"
      channel_id:
        type: "string"
        optional: true
      label:
        type: "string"
      timestamp:
        type: "number"

  state_tab_removed:
    name: "state/tab/removed"
    description: "TAB移除事件"
    payload:
      tab_key:
        type: "string"
      timestamp:
        type: "number"

  state_tab_switched:
    name: "state/tab/switched"
    description: "TAB切换事件"
    payload:
      tab_key:
        type: "string"
      previous_tab_key:
        type: "string"
        optional: true
      timestamp:
        type: "number"

  state_settings_changed:
    name: "state/settings/changed"
    description: "设置变更事件"
    payload:
      setting_key:
        type: "string"
      old_value:
        type: "object"
        optional: true
      new_value:
        type: "object"
        optional: true
      timestamp:
        type: "number"

  state_device_list_request:
    name: "state/device/list/request"
    description: "获取设备列表请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"

  state_device_list_response:
    name: "state/device/list/response"
    description: "设备列表响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      devices:
        type: "array"
        items:
          device_id: { type: "string" }
          device_type: { type: "string" }
          name: { type: "string" }
          connected: { type: "boolean" }
      timestamp:
        type: "number"

  state_device_get_request:
    name: "state/device/{device_id}/get/request"
    description: "获取设备状态请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      device_id:
        type: "string"

  state_device_get_response:
    name: "state/device/{device_id}/get/response"
    description: "设备状态响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      device_id:
        type: "string"
      device:
        type: "object"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

  state_tab_list_request:
    name: "state/tab/list/request"
    description: "获取TAB列表请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"

  state_tab_list_response:
    name: "state/tab/list/response"
    description: "TAB列表响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      tabs:
        type: "array"
        items:
          key: { type: "string" }
          device_id: { type: "string" }
          channel_id: { type: "string", optional: true }
          label: { type: "string" }
          is_active: { type: "boolean" }
      active_tab_key:
        type: "string"
        optional: true
      timestamp:
        type: "number"

  state_settings_get_request:
    name: "state/settings/get/request"
    description: "获取设置请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      setting_key:
        type: "string"
        optional: true

  state_settings_get_response:
    name: "state/settings/get/response"
    description: "设置响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      settings:
        type: "object"
      success:
        type: "boolean"

  state_settings_set_request:
    name: "state/settings/set/request"
    description: "设置设置请求"
    direction: "frontend_to_backend"
    payload:
      request_id:
        type: "string"
      settings:
        type: "object"

  state_settings_set_response:
    name: "state/settings/set/response"
    description: "设置设置响应"
    direction: "backend_to_frontend"
    payload:
      request_id:
        type: "string"
      success:
        type: "boolean"
      error:
        type: "string"
        optional: true

