<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景渐变圆角矩形 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bd5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f53844;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42378f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 桥梁/连接弧线（左 -> 右） -->
  <path d="M120 280 Q180 200 256 240 Q332 280 392 200" 
        stroke="url(#accentGrad)" stroke-width="28" fill="none" stroke-linecap="round"/>
  
  <!-- 连接节点圆点 -->
  <circle cx="120" cy="280" r="24" fill="#00d2ff"/>
  <circle cx="392" cy="200" r="24" fill="#3a7bd5"/>

  <!-- 中间数据节点（串口/蓝牙符号组合） -->
  <!-- 串口符号 - D 形接口 -->
  <rect x="220" y="220" width="72" height="72" rx="12" ry="12" fill="none" stroke="url(#accentGrad)" stroke-width="6"/>
  <!-- 内部引脚 -->
  <circle cx="242" cy="242" r="6" fill="#00d2ff"/>
  <circle cx="256" cy="256" r="6" fill="#00d2ff"/>
  <circle cx="270" cy="270" r="6" fill="#00d2ff"/>
  
  <!-- 蓝牙符号（叠加） -->
  <path d="M256 190 L256 310 M256 220 L280 200 L256 250 L280 300 L256 280" 
        stroke="#3a7bd5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- 底部数据流波形 -->
  <path d="M80 400 Q120 370 160 400 Q200 430 240 400 Q280 370 320 400 Q360 430 400 400 Q420 385 440 400" 
        stroke="#00d2ff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- 上部传输光点 -->
  <circle r="6" fill="#fff" opacity="0.8">
    <animateMotion dur="2s" repeatCount="indefinite" path="M120 280 Q180 200 256 240 Q332 280 392 200"/>
  </circle>

  <!-- 文字: C / B -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="#00d2ff" text-anchor="middle" letter-spacing="8">C</text>
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="#3a7bd5" text-anchor="middle" dx="28">B</text>
</svg>