[package]
name = "combridge-rust"
version = "0.5.26"
description = "A Tauri App"
authors = ["XiaoPb"]
edition = "2021"

[lib]
name = "combridge_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-log = "0.2"
async-trait = "0.1"
serialport = "4"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
mlua = { version = "0.9", features = ["lua54", "vendored", "send"] }
sysinfo = "0.30"
open = "5"
rmp = "0.8"
rmp-serde = "1.1"
chrono = "0.4"
chrono-tz = "0.10"
bluest = "0.6"
futures = "0.3"
dirs = "5"
serde_yaml = "0.9"
crossbeam-channel = "0.5"
parking_lot = "0.12"
once_cell = "1"
regex = "1"
gh-rpc = { path = "../libs/protocol_rust/gh-rpc" }
rpc = { path = "../libs/protocol_rust/rpc" }
heapless = "0.8"
base64 = "0.22"
csv = "1.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dwmapi", "winuser", "windef"] }
winreg = "0.52"

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
panic = "unwind"

[dev-dependencies]
tempfile = "3"
